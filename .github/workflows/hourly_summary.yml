name: Chatwork Hourly Summary

on:
  schedule:
    # JST 10:00-18:00 = UTC 1:00-9:00 (毎日)
    - cron: '0 1 * * *'   # 10:00 JST
    - cron: '0 2 * * *'   # 11:00 JST
    - cron: '0 3 * * *'   # 12:00 JST
    - cron: '0 4 * * *'   # 13:00 JST
    - cron: '0 5 * * *'   # 14:00 JST
    - cron: '0 6 * * *'   # 15:00 JST
    - cron: '0 7 * * *'   # 16:00 JST
    - cron: '0 8 * * *'   # 17:00 JST
    - cron: '0 9 * * *'   # 18:00 JST
  workflow_dispatch:  # 手動実行も可能

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install gspread google-auth requests

      - name: Send hourly summary
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python send_hourly_summary.py
