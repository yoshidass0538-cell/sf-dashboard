name: NURO Daily Report (Chatwork)

on:
  # GitHub標準のscheduleはラグ(15〜60分)が出るため使わない。
  # cron-job.org から毎日19:00(JST)ちょうどに workflow_dispatch で発火させる
  # （sync_report / hourly_summary と同方式）。
  workflow_dispatch:

jobs:
  send:
    # 2026-06-19 ユーザー指示により配信停止中。再開する時は次の if 行を削除する。
    # （cron-job.org からの発火は続くが、このジョブがスキップされ何も送信しない）
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install simple-salesforce requests

      - name: Send NURO daily report
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_TOKEN: ${{ secrets.SF_TOKEN }}
          SF_DOMAIN: login
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
        run: python send_nuro_daily_report.py
