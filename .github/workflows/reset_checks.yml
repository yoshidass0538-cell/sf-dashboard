name: Reset Orikaeshi Checks

on:
  # スケジュールは cron-job.org から workflow_dispatch で発火（GitHub標準cronは遅延が大きいため廃止）
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: Reset checks
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python reset_checks.py
