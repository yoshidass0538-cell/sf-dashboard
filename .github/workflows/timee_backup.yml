name: Timee Worker Texts Backup

# cron-job.org から workflow_dispatch で発火(1日1回想定)
on:
  workflow_dispatch:

concurrency:
  group: timee-backup
  cancel-in-progress: false

jobs:
  backup:
    # === タイミー機構 一時停止 (2026-07-01) ===
    # 同期停止に伴い日次バックアップも停止（データは凍結済みで変化しないため）。
    # 再開するときは下の if 行を削除するだけ。
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: Run backup
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python timee_backup.py backup
