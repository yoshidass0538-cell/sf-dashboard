name: Timee Schedule Sync

# cron-job.org から workflow_dispatch で発火（GitHub標準cronは遅延が大きいため未使用）
on:
  workflow_dispatch:

concurrency:
  group: timee-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: timee-pip-${{ hashFiles('**/timee_sync.py') }}

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install playwright pandas openpyxl gspread google-auth requests

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Timee sync
        env:
          TIMEE_EMAIL: ${{ secrets.TIMEE_EMAIL }}
          TIMEE_PASSWORD: ${{ secrets.TIMEE_PASSWORD }}
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python timee_sync.py

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: timee-failure-dump
          path: tmp/
          if-no-files-found: ignore
          retention-days: 7
